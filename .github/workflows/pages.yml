# Publica a pasta do site no GitHub Pages a cada push na main.
# So a pasta trabalhos/hmx-trabalho-teste/site/ vai ao ar; o resto do
# repositorio (guias, ferramentas de qualidade) fica so no codigo.
name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trabalhos/hmx-trabalho-teste/site
      - id: publicacao
        uses: actions/deploy-pages@v4
